# 管理后台的 Nginx 配置：托管静态产物 + 同源反代 /api 到后端容器。
#
# ## 为什么要**同源**反代（而不是让前端直连后端域名）
#
# 管理后台的 refresh token 走 **httpOnly Cookie**，其 `Path=/api/v1/auth`、
# `SameSite=lax`（见 `backend/app/core/config.py`）。同源时浏览器会正常带上它；
# 一旦前后端分属不同源，`lax` 就不再发送跨站 Cookie，表现为
# "登录成功但一刷新就掉线" —— 而且很难看出原因。
#
# 所以这里把 `/api` 反代到后端容器，浏览器视角**只有一个源**。
# （真要分域名部署，得同时改 `KB_REFRESH_COOKIE_SAMESITE=none` 与
#   `KB_REFRESH_COOKIE_SECURE=true`，并且上 HTTPS。）

server {
    listen 80;
    server_name _;

    # 静态产物
    root /usr/share/nginx/html;
    index index.html;

    # 上传/请求体上限（目前都是小 JSON，留一点余量即可）
    client_max_body_size 8m;

    # gzip：前端产物里 antd 那个 chunk 有 1.2 MB，压完 ~400 KB，值得开
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;

    # 带哈希的产物可以长期缓存；index.html **绝不能**缓存，
    # 否则发新版本后用户的浏览器还在加载旧的 index 去引用已删除的 chunk。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 反代后端。
    #
    # ⚠ `proxy_pass http://backend:8000;` **末尾不能加斜杠**，
    #   否则 `/api/v1/x` 会被改写成 `/v1/x`（nginx 的 location 前缀会被剥掉）。
    #   这是最容易踩、且报错信息完全不指向原因的一个坑（表现为全站 404）。
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;

        # 后端要拿真实来源做审计；不传的话日志里全是容器内网 IP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长请求（打印 PDF 可能慢）
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 后端文档：方便部署后自检（不想暴露可以删掉这段）
    location /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # 免健康检查（给 Docker healthcheck 与运维探活用）
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SPA 前端路由兜底：**必须放最后**。
    # `/patients` 这类路径在服务端没有对应文件，直接 404；
    # `try_files ... /index.html` 把它交给前端路由处理。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
