org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# ---- 必须关掉 Kotlin 增量编译（本机环境限制，不是代码问题）----
#
# 现象：加了 `share_plus` 之后 Android 构建失败，报
#   java.lang.AssertionError: Could not close incremental caches in
#   .../build/share_plus/kotlin/compileDebugKotlin/cacheable/caches-jvm/...
#   Suppressed: IllegalArgumentException:
#     this and base files have different roots:
#     C:\Users\...\Pub\Cache\hosted\pub.flutter-io.cn\share_plus-13.3.1\android\src\main\kotlin\...
#     and D:\code\rehab-record\app\android
#
# 根因：**pub 缓存在 C: 盘、本工程在 D: 盘**。Kotlin 的增量编译缓存要求
# "相对路径能基于同一个根"，跨盘符时基路径不同（`C:\...` vs `D:\...`），
# 它无法建立相对路径，于是在写缓存时抛错。
#
# 影响面：只影响**构建速度**（增量失效），不影响产物正确性。
# 换到同一盘符的 pub 缓存可以绕开，但那要改全局环境变量，代价更大。
kotlin.incremental=false

